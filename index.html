<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stamen on GitHub</title>
  <meta name="description" content="Projects from the Stamen team, hosted on GitHub Pages.">
  <style>
    :root {
      --bg: #f7f5f0;
      --fg: #1d1d1b;
      --muted: #6b6a66;
      --rule: #d9d5cc;
      --accent: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615;
        --fg: #eceae4;
        --muted: #9a988f;
        --rule: #33322f;
        --accent: #fb923c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 4rem 1rem 3rem;
    }
    h1 {
      font-size: clamp(1.75rem, 7vw, 2.25rem);
      overflow-wrap: anywhere;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
    }
    .lede { color: var(--muted); margin: 0 0 3rem; }
    h2 {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0 0 0.5rem;
    }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
    li { border-bottom: 1px solid var(--rule); }
    li a {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0 1rem;
      padding: 1rem 0;
      color: inherit;
      text-decoration: none;
    }
    li a:hover .name, li a:focus-visible .name { color: var(--accent); }
    .name { font-weight: 600; font-size: 1.15rem; }
    .arrow { color: var(--muted); }
    a { color: var(--accent); }
    footer { margin-top: 3rem; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Stamen</h1>
    <p class="lede">Projects from the <a href="https://stamen.com/">Stamen</a> team.</p>

    <section>
      <h2>Projects</h2>
      <ul>
        <li>
          <a href="https://stamen.github.io/30-day-map-challenge-2026/">
            <span class="name">#30DayMapChallenge 2026</span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </li>
      </ul>
    </section>

    <footer>
      <a href="https://github.com/stamen">github.com/stamen</a>
    </footer>
  </main>
</body>
</html>
