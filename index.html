<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stamen on GitHub</title>
  <meta name="description" content="Projects from the Stamen team, hosted on GitHub Pages.">
  <style>
    :root {
      --bg: #fff;
      --fg: #000;
      --hl: #ffff00;
      --hl-fg: #000;
      --box: #000;
      --box-fg: #fff;
      --muted: #555;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000;
        --fg: #fff;
        --box: #fff;
        --box-fg: #000;
        --muted: #aaa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 18px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    main {
      max-width: 44rem;
      margin: 0 auto;
      padding: 4rem 1rem 3rem;
    }
    h1 {
      font-size: min(4rem, calc((min(100vw, 44rem) - 2rem) / 11.5));
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.02em;
      margin: 0 0 1.5rem;
      overflow-wrap: anywhere;
    }
    .hl {
      background: var(--hl);
      color: var(--hl-fg);
      padding: 0 0.12em;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    .lede { font-size: 1.15rem; margin: 0 0 3rem; max-width: 34rem; }
    a { color: inherit; text-decoration-thickness: 2px; text-underline-offset: 3px; }
    a:hover, a:focus-visible { background: var(--hl); color: var(--hl-fg); }
    h2 {
      display: inline-block;
      background: var(--box);
      color: var(--box-fg);
      font-size: 1rem;
      font-weight: 700;
      padding: 0.35rem 0.7rem;
      margin: 0;
    }
    ul { list-style: none; margin: 0; padding: 0; border-top: 4px solid var(--fg); }
    li { border-bottom: 2px solid var(--fg); }
    li a {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 0 1rem;
      padding: 1rem 0.5rem;
      text-decoration: none;
    }
    ul.maps li a { grid-template-columns: 4.25rem 1fr auto; }
    .day {
      justify-self: start;
      background: var(--box);
      color: var(--box-fg);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.2rem 0.5rem;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    li a:hover .day, li a:focus-visible .day { background: var(--hl-fg); color: var(--hl); }
    .name { display: block; font-weight: 700; font-size: 1.35rem; line-height: 1.2; }
    .meta { display: block; font-size: 1rem; }
    .arrow { font-weight: 700; font-size: 1.35rem; }
    footer { margin-top: 3rem; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1><span class="hl">Stamen</span></h1>
    <p class="lede">Projects from the <a href="https://stamen.com/">Stamen</a> team.</p>

    <section>
      <h2>Projects</h2>
      <ul>
        <li>
          <a href="https://stamen.github.io/30-day-map-challenge-2026/">
            <span class="name">#30DayMapChallenge 2026</span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </li>
      </ul>
    </section>

    <footer>
      <a href="https://github.com/stamen">github.com/stamen</a>
    </footer>
  </main>
</body>
</html>
